# ====================================================================
# BYOL — ResNet-50 baseline config
# ====================================================================

method: byol

# ---- base 공통 설정 ----
backbone:
  name: resnet50
  small_image: true
  zero_init_residual: true

data:
  root: ./data
  dataset: stl10_unlabeled
  image_size: 96
  num_workers: 8
  persistent_workers: true
  download: true

augmentation:
  crop_scale: [0.2, 1.0]
  color_jitter: [0.4, 0.4, 0.4, 0.1]
  color_jitter_p: 0.8
  grayscale_p: 0.2
  gaussian_blur_p: 0.5

optimizer:
  name: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 1.0e-4
  predictor_lr_mult: 10.0     # BYOL 권장: predictor만 LR 10배

schedule:
  epochs: 400
  warmup_epochs: 10

training:
  batch_size: 512             # BYOL은 negative 없어서 batch 작아도 됨. OOM 나면 256.
  amp: true
  grad_clip: null
  seed: 42
  log_every: 50
  save_every: 10
  keep_last_n_ckpts: 3

# ---- BYOL 전용 ----
projection:
  hidden_dim: 4096            # BYOL은 projection 큼
  output_dim: 256
  num_layers: 2

predictor:
  input_dim: 256              # projection.output_dim과 같아야 함
  hidden_dim: 4096
  output_dim: 256

byol:
  ema_tau_base: 0.996
  ema_schedule: cosine        # τ를 base → 1.0으로 cosine 증가
  symmetric_loss: true

output:
  dir: ./outputs/byol_r50_seed42
  log_file: ./logs/byol_seed42.log
